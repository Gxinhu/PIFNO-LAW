defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  # - rich_progress_bar
  - _self_
  - epoch_timer

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/data_loss"
  mode: "min"
  save_last: False
  auto_insert_metric_name: False
early_stopping:
  monitor: "val/data_loss"
  patience: 200
  mode: "min"

model_summary:
  max_depth: -1
